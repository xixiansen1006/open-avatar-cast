<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c4a8"/>
      <stop offset="100%" stop-color="#d4a888"/>
    </linearGradient>
    <linearGradient id="hair2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
  </defs>
  <rect width="320" height="360" fill="url(#bg2)" rx="24"/>
  <!-- hair back -->
  <ellipse cx="160" cy="160" rx="88" ry="100" fill="url(#hair2)"/>
  <!-- face -->
  <ellipse id="face" cx="160" cy="175" rx="72" ry="85" fill="url(#skin2)"/>
  <!-- hair top / side -->
  <path d="M95 130 Q120 70 160 75 Q210 70 230 120 L225 155 Q180 90 160 95 Q130 100 100 150Z" fill="url(#hair2)"/>
  <!-- glasses -->
  <rect x="105" y="148" width="42" height="28" rx="6" fill="none" stroke="#4fc3f7" stroke-width="3"/>
  <rect x="173" y="148" width="42" height="28" rx="6" fill="none" stroke="#4fc3f7" stroke-width="3"/>
  <line x1="147" y1="160" x2="173" y2="160" stroke="#4fc3f7" stroke-width="2"/>
  <!-- eyes -->
  <ellipse cx="126" cy="162" rx="8" ry="9" fill="#1a1a1a"/>
  <ellipse cx="194" cy="162" rx="8" ry="9" fill="#1a1a1a"/>
  <!-- nose -->
  <path d="M160 175 L157 198 L164 198" fill="none" stroke="#c4956a" stroke-width="2" stroke-linecap="round"/>
  <!-- mouth (lip-sync target) -->
  <ellipse id="mouth" cx="160" cy="228" rx="16" ry="5" fill="#8b3a4a"/>
  <!-- jacket -->
  <path d="M85 275 Q160 245 235 275 L245 360 L75 360Z" fill="#263238"/>
  <path d="M160 255 L160 360" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <text x="160" y="340" text-anchor="middle" fill="#4fc3f7" font-family="sans-serif" font-size="14" opacity="0.8">cool_guide</text>
</svg>
